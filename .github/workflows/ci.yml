name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: safeher
          POSTGRES_PASSWORD: safeher
          POSTGRES_DB: safeher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: safeher_backend
    env:
      DATABASE_URL: postgresql://safeher:safeher@localhost:5432/safeher_test
      SECRET_KEY: ci-secret-key-not-for-production-use-32ch
      ENVIRONMENT: development
      DEBUG: "true"
      OTP_PROVIDER: mock
      OTP_ALLOW_DEV_SHORTCUT: "true"
      AI_AUTO_SOS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: pip install -r requirements.txt
      - name: Migrate
        run: alembic upgrade head
      - name: Pytest
        run: python -m pytest tests -q --tb=short
      - name: Production config validator (dev env)
        run: python scripts/validate_production_config.py
        continue-on-error: true

  retraining-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safeher_ai/training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate tests (never trains)
        run: python -m pytest test_retraining_gate.py -q --tb=short
      - name: Retraining gate dry run
        run: python retraining_gate.py

  android-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safeher_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Placeholder google-services if missing
        run: |
          if [ ! -f app/google-services.json ]; then
            printf '%s\n' '{"project_info":{"project_number":"0","project_id":"safeher-ci"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:ci","android_client_info":{"package_name":"com.safeher.app"}},"api_key":[{"current_key":"ci"}],"oauth_client":[],"services":{}},{"client_info":{"mobilesdk_app_id":"1:0:android:debug","android_client_info":{"package_name":"com.safeher.app.debug"}},"api_key":[{"current_key":"ci"}],"oauth_client":[],"services":{}}]}' > app/google-services.json
          fi
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

  play-release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Play release source gates
        run: python safeher_android/scripts/verify_play_release.py
      - name: Confirm AI auto-SOS remains false
        run: |
          python - <<'PY'
          from pathlib import Path
          g = Path("safeher_android/app/build.gradle.kts").read_text(encoding="utf-8")
          c = Path("safeher_android/app/src/main/assets/decision_contract.json").read_text(encoding="utf-8")
          assert 'AI_AUTO_SOS_ENABLED", "true"' not in g
          assert '"AI_AUTO_SOS_ENABLED": false' in c
          assert '"DEMO_MODE": true' in c
          print("PASS: AI_AUTO_SOS_ENABLED=false DEMO_MODE=true")
          PY
