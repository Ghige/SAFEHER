<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SafeHer real-world AI review</title>
  <style>
    body { font-family: sans-serif; margin: 16px; max-width: 960px; }
    .card { border: 1px solid #ccc; padding: 12px; margin: 12px 0; }
    button { margin-right: 8px; }
    .warn { color: #a40; }
  </style>
</head>
<body>
  <h1>Real-world AI feedback review</h1>
  <p class="warn">Metadata only. No audio. AI predictions are never gold. Dual DISTRESS required.</p>
  <label>Reviewer ID <input id="rid" /></label>
  <button type="button" id="load">Load</button>
  <pre id="progress"></pre>
  <div id="items"></div>
  <script>
    async function load() {
      const rid = document.getElementById("rid").value.trim();
      const r = await fetch("/api/items?reviewer_id=" + encodeURIComponent(rid));
      const data = await r.json();
      document.getElementById("progress").textContent = JSON.stringify(data.progress, null, 2);
      const root = document.getElementById("items");
      root.innerHTML = "";
      for (const item of data.items) {
        const d = document.createElement("div");
        d.className = "card";
        d.innerHTML = "<strong>" + item.event_id + "</strong><br/>"
          + "category=" + (item.candidate_category || "") + " pred=" + (item.prediction_state || "")
          + " conf=" + (item.confidence || "") + " feedback=" + (item.user_feedback || "");
        for (const v of data.options) {
          const b = document.createElement("button");
          b.textContent = v;
          b.onclick = async () => {
            await fetch("/api/review", {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({event_id: item.event_id, reviewer_id: rid, manual_verdict: v}),
            });
            load();
          };
          d.appendChild(b);
        }
        root.appendChild(d);
      }
    }
    document.getElementById("load").onclick = load;
  </script>
</body>
</html>
