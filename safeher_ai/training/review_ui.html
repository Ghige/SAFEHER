<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SafeHer — distress clip review</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2a3240;
    --tx:#e6edf3; --dim:#8b98a8; --accent:#4c9aff;
    --distress:#f85149; --hardneg:#d29922; --reject:#8b949e; --amb:#a371f7;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--tx)}
  header{display:flex;align-items:center;gap:18px;padding:12px 20px;
         background:var(--panel);border-bottom:1px solid var(--line);
         position:sticky;top:0;z-index:10;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  .bar{flex:1;min-width:180px;height:7px;background:#222a36;border-radius:4px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#2ea043,#4c9aff);width:0}
  .muted{color:var(--dim);font-size:12px}
  select,button,input{font:inherit;color:var(--tx);background:var(--panel2);
        border:1px solid var(--line);border-radius:7px;padding:6px 10px}
  button{cursor:pointer}
  button:hover{border-color:#3d4c63}
  main{display:grid;grid-template-columns:300px 1fr;gap:0;height:calc(100vh - 58px)}
  aside{border-right:1px solid var(--line);overflow-y:auto;background:#11151b}
  .row{padding:9px 14px;border-bottom:1px solid #1b212b;cursor:pointer;display:flex;
       gap:9px;align-items:center}
  .row:hover{background:#171d26}
  .row.sel{background:#1d2735;box-shadow:inset 3px 0 0 var(--accent)}
  .row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:9px;height:9px;border-radius:50%;background:#333c4a;flex:none}
  .dot.DISTRESS{background:var(--distress)} .dot.HARD_NEGATIVE{background:var(--hardneg)}
  .dot.REJECT{background:var(--reject)} .dot.AMBIGUOUS{background:var(--amb)}
  section{overflow-y:auto;padding:22px 28px}
  .title{font-size:20px;font-weight:600;margin:0 0 4px;word-break:break-word}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;
        padding:16px 18px;margin-bottom:16px}
  canvas{width:100%;height:110px;display:block;background:#0b0e13;border-radius:8px}
  audio{width:100%;margin-top:10px}
  .grid{display:grid;grid-template-columns:130px 1fr;gap:7px 14px;font-size:13px}
  .k{color:var(--dim)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:3px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;
        padding:2px 10px;font-size:12px;color:#c3ced9}
  .guess{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;
         font-weight:600;background:#1f2937;border:1px solid var(--line)}
  .verdicts{display:flex;gap:10px;flex-wrap:wrap}
  .v{flex:1;min-width:150px;padding:13px;border-radius:10px;font-weight:600;
     border:1.5px solid var(--line);background:var(--panel2);text-align:left}
  .v small{display:block;font-weight:400;color:var(--dim);font-size:11.5px;margin-top:3px}
  .v.on{color:#06111f}
  .v[data-v=DISTRESS].on{background:var(--distress);border-color:var(--distress)}
  .v[data-v=HARD_NEGATIVE].on{background:var(--hardneg);border-color:var(--hardneg)}
  .v[data-v=REJECT].on{background:var(--reject);border-color:var(--reject)}
  .v[data-v=AMBIGUOUS].on{background:var(--amb);border-color:var(--amb)}
  textarea{width:100%;background:var(--panel2);color:var(--tx);border:1px solid var(--line);
           border-radius:8px;padding:9px;font:inherit;resize:vertical;min-height:56px}
  kbd{background:#0b0e13;border:1px solid var(--line);border-bottom-width:2px;
      border-radius:5px;padding:1px 6px;font-size:11px;font-family:inherit;color:var(--dim)}
  .warn{border-left:3px solid var(--hardneg);padding-left:12px;color:#c9b884;font-size:12.5px}
  a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1 id="dsname">SafeHer · distress clip review</h1>
  <div class="bar"><i id="pfill"></i></div>
  <span class="muted" id="pnum">0 / 0</span>
  <select id="filter">
    <option value="todo">Unjudged only</option>
    <option value="all">All clips</option>
    <option value="done">Judged only</option>
  </select>
  <label class="muted"><input type="checkbox" id="auto" checked style="vertical-align:-2px"> autoplay</label>
</header>

<main>
  <aside id="list"></aside>
  <section id="pane"></section>
</main>

<script>
let ITEMS=[], VERDICTS={}, VIEW=[], idx=0, ctx=null;

const esc = s => (s??'').toString().replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function boot(){
  const r = await fetch('/api/items');
  const d = await r.json();
  ITEMS = d.items; VERDICTS = d.verdicts;
  document.getElementById('dsname').textContent = 'SafeHer · ' + d.dataset + ' review';
  document.title = 'SafeHer — ' + d.dataset;
  // Only offer guesses that actually occur in this queue.
  const present = new Set(ITEMS.map(i=>i.category));
  const sel = document.getElementById('filter');
  (d.categories||[]).filter(c=>present.has(c)).forEach(c=>{
    const o = document.createElement('option');
    o.value = c; o.textContent = 'Guess: ' + c; sel.appendChild(o);
  });
  sel.onchange = ()=>{ applyFilter(); };
  applyFilter();
}

function applyFilter(){
  const f = document.getElementById('filter').value;
  VIEW = ITEMS.filter(it=>{
    const v = VERDICTS[it.id];
    if(f==='todo') return !v || !v.verdict;
    if(f==='done') return v && v.verdict;
    if(f==='all') return true;
    return it.category===f;
  });
  if(!VIEW.length) VIEW = ITEMS;
  idx = 0;
  renderList(); show();
}

function renderList(){
  document.getElementById('list').innerHTML = VIEW.map((it,i)=>{
    const v = (VERDICTS[it.id]||{}).verdict || '';
    return `<div class="row ${i===idx?'sel':''}" onclick="go(${i})">
      <span class="dot ${v}"></span>
      <span class="t">${esc(it.title || '(untitled)')}</span>
      <span class="muted">${it.duration ?? '?'}s</span></div>`;
  }).join('');
  const done = Object.values(VERDICTS).filter(v=>v.verdict).length;
  document.getElementById('pnum').textContent = `${done} judged / ${ITEMS.length}`;
  document.getElementById('pfill').style.width = (100*done/ITEMS.length)+'%';
}

function go(i){ idx = Math.max(0, Math.min(VIEW.length-1, i)); renderList(); show();
  document.querySelector('.row.sel')?.scrollIntoView({block:'nearest'}); }

function show(){
  const it = VIEW[idx];
  if(!it){ document.getElementById('pane').innerHTML='<p class="muted">Nothing to review.</p>'; return; }
  const v = VERDICTS[it.id] || {verdict:'', notes:''};
  const flags = [];
  if(it.clipping_pct > 1) flags.push(`clipping ${it.clipping_pct}%`);
  if(it.silence_pct > 60) flags.push(`silence ${it.silence_pct}%`);
  if(it.duration < 1) flags.push(`very short ${it.duration}s`);

  // Acoustic measures only exist for datasets that were audited for them.
  const acoustic = [
    it.duration != null ? it.duration + 's' : null,
    it.lufs != null ? it.lufs + ' LUFS' : null,
    it.rms_dbfs != null ? 'RMS ' + it.rms_dbfs + ' dBFS' : null,
  ].filter(Boolean).join(' · ');

  const link = it.link && it.link.href
    ? ` · <a href="${esc(it.link.href)}" target="_blank" rel="noopener">${esc(it.link.text)}</a>`
    : '';

  const facts = (it.facts||[]).filter(f=>f[1]).map(f=>
    `<span class="k">${esc(f[0])}</span><span>${esc(f[1])}</span>`).join('');

  const chips = (it.chips||[]).length
    ? `<span class="k">${esc(it.chips_label||'Tags')}</span><span><span class="chips">${
        it.chips.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</span></span>`
    : '';

  const queued = it.review_reason
    ? `<span class="k">Queued because</span><span class="muted">${esc(it.review_reason)}</span>`
    : '';

  document.getElementById('pane').innerHTML = `
    <div class="title">${esc(it.title || '(untitled)')}</div>
    <div class="sub">clip ${idx+1} of ${VIEW.length} · ${esc(it.id)} · ${esc(it.subtitle||'')}${link}</div>

    <div class="card">
      <canvas id="wave"></canvas>
      <audio id="au" controls preload="auto" src="/audio/${encodeURIComponent(it.id)}.wav"></audio>
      <div class="muted" style="margin-top:8px">
        ${acoustic || '—'}
        ${flags.length? ' · <span style="color:#d29922">'+flags.join(' · ')+'</span>':''}
      </div>
    </div>

    <div class="card">
      <div class="grid">
        <span class="k">Your verdict</span><span>
          <span class="guess" style="background:#0b0e13">${v.verdict || 'not judged yet'}</span></span>
        <span class="k">Heuristic guess</span>
        <span><span class="guess">${esc(it.category)}</span>
          <span class="muted"> ${esc(it.category_note||'')}</span></span>
        ${facts}
        ${chips}
        <span class="k">Why guessed</span><span class="muted">${esc(it.evidence)}</span>
        ${queued}
      </div>
    </div>

    <div class="card">
      <div class="warn" style="margin-bottom:14px">Judge what you <em>hear</em>. The heuristic
        guess above came from metadata only and is wrong often enough to matter —
        override it freely.</div>
      <div class="verdicts">
        <button class="v ${v.verdict==='DISTRESS'?'on':''}" data-v="DISTRESS" onclick="setV('DISTRESS')">
          <kbd>1</kbd> DISTRESS<small>real fear/pain/help — should trigger SOS</small></button>
        <button class="v ${v.verdict==='HARD_NEGATIVE'?'on':''}" data-v="HARD_NEGATIVE" onclick="setV('HARD_NEGATIVE')">
          <kbd>2</kbd> HARD_NEGATIVE<small>loud voice, but must NOT trigger SOS</small></button>
        <button class="v ${v.verdict==='REJECT'?'on':''}" data-v="REJECT" onclick="setV('REJECT')">
          <kbd>3</kbd> REJECT<small>unusable: broken, music, synthetic</small></button>
        <button class="v ${v.verdict==='AMBIGUOUS'?'on':''}" data-v="AMBIGUOUS" onclick="setV('AMBIGUOUS')">
          <kbd>4</kbd> AMBIGUOUS<small>genuinely cannot tell</small></button>
      </div>
      <textarea id="notes" placeholder="Optional note…"
        onchange="saveNotes()">${esc(v.notes)}</textarea>
      <div class="muted" style="margin-top:9px">
        <kbd>1</kbd>–<kbd>4</kbd> judge &amp; advance · <kbd>space</kbd> replay ·
        <kbd>←</kbd><kbd>→</kbd> move · <kbd>0</kbd> clear · notes autosave
      </div>
    </div>`;

  const au = document.getElementById('au');
  if(document.getElementById('auto').checked) au.play().catch(()=>{});
  drawWave(it.id);
}

async function drawWave(id){
  const cv = document.getElementById('wave');
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth*dpr; cv.height = cv.clientHeight*dpr;
  const g = cv.getContext('2d');
  g.fillStyle='#0b0e13'; g.fillRect(0,0,cv.width,cv.height);
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    const buf = await ctx.decodeAudioData(await (await fetch(`/audio/${id}.wav`)).arrayBuffer());
    const ch = buf.getChannelData(0), W = cv.width, H = cv.height, step = Math.ceil(ch.length/W);
    g.strokeStyle='#1e2733'; g.beginPath(); g.moveTo(0,H/2); g.lineTo(W,H/2); g.stroke();
    g.fillStyle='#4c9aff';
    for(let x=0;x<W;x++){
      let mn=1, mx=-1;
      for(let j=0;j<step;j++){ const s=ch[x*step+j]; if(s===undefined)break;
        if(s<mn)mn=s; if(s>mx)mx=s; }
      const y1=(1-mx)*H/2, y2=(1-mn)*H/2;
      g.fillRect(x, y1, 1, Math.max(1, y2-y1));
    }
  }catch(e){ g.fillStyle='#8b98a8'; g.font=`${12*dpr}px sans-serif`;
             g.fillText('waveform unavailable', 10*dpr, 20*dpr); }
}

async function post(body){
  await fetch('/api/verdict', {method:'POST', headers:{'Content-Type':'application/json'},
                               body: JSON.stringify(body)});
}

async function setV(verdict){
  const it = VIEW[idx]; if(!it) return;
  const notes = document.getElementById('notes')?.value || '';
  const cur = VERDICTS[it.id]?.verdict;
  const next = cur===verdict ? '' : verdict;      // pressing the same key un-judges
  VERDICTS[it.id] = {verdict: next, notes};
  await post({clip_id: it.id, verdict: next, notes});
  renderList();
  if(next && idx < VIEW.length-1) go(idx+1); else show();
}

async function saveNotes(){
  const it = VIEW[idx]; if(!it) return;
  const notes = document.getElementById('notes').value;
  const verdict = VERDICTS[it.id]?.verdict || '';
  VERDICTS[it.id] = {verdict, notes};
  await post({clip_id: it.id, verdict, notes});
}

document.addEventListener('keydown', e=>{
  if(e.target.tagName === 'TEXTAREA') return;
  const map = {'1':'DISTRESS','2':'HARD_NEGATIVE','3':'REJECT','4':'AMBIGUOUS'};
  if(map[e.key]){ e.preventDefault(); setV(map[e.key]); }
  else if(e.key==='0'){ e.preventDefault(); const it=VIEW[idx];
    if(it){ VERDICTS[it.id]={verdict:'',notes:''}; post({clip_id:it.id,verdict:'',notes:''});
            renderList(); show(); } }
  else if(e.key==='ArrowRight'){ e.preventDefault(); go(idx+1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); go(idx-1); }
  else if(e.key===' '){ e.preventDefault(); const a=document.getElementById('au');
    if(a){ a.currentTime=0; a.play().catch(()=>{}); } }
});

boot();
</script>
</body>
</html>
