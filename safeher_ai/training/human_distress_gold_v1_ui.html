<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SafeHer Human Distress Gold v1 — Review</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--panel2:#1c2230;--line:#2a3240;--tx:#e6edf3;--dim:#8b98a8;--accent:#4c9aff;--distress:#f85149;--normal:#3fb950;--unc:#d29922}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
  header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  h1{font-size:14px;margin:0}
  .muted{color:var(--dim);font-size:12px}
  select,button,input,textarea{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
  button{cursor:pointer}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:#e3b341;border-color:var(--unc)}
  main{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 118px)}
  aside{border-right:1px solid var(--line);overflow-y:auto;background:#11151b}
  .row{padding:8px 12px;border-bottom:1px solid #1b212b;cursor:pointer;display:flex;gap:8px;align-items:center}
  .row.sel{background:#1d2735;box-shadow:inset 3px 0 0 var(--accent)}
  .row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
  .dot{width:9px;height:9px;border-radius:50%;background:#333c4a}
  .dot.DISTRESS{background:var(--distress)} .dot.NORMAL{background:var(--normal)} .dot.UNCERTAIN{background:var(--unc)}
  section{overflow-y:auto;padding:20px 26px}
  .banner{background:#2a2110;border:1px solid #6e5218;color:#e3b341;padding:10px 14px;border-radius:8px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:180px 1fr;gap:6px 12px}
  .k{color:var(--dim)}
  .verdicts{display:flex;gap:8px;flex-wrap:wrap}
  .v{flex:1;min-width:140px;padding:12px;border-radius:10px;font-weight:600;border:1.5px solid var(--line);background:var(--panel2);text-align:left}
  .v small{display:block;font-weight:400;color:var(--dim);font-size:11px;margin-top:3px}
  .v.on[data-v=DISTRESS]{background:var(--distress);border-color:var(--distress);color:#06111f}
  .v.on[data-v=NORMAL]{background:var(--normal);border-color:var(--normal);color:#06111f}
  .v.on[data-v=UNCERTAIN]{background:var(--unc);border-color:var(--unc);color:#06111f}
  audio{width:100%;margin-top:8px}
  .targets{display:flex;gap:16px;padding:8px 18px;background:#11151b;border-bottom:1px solid var(--line);flex-wrap:wrap}
  kbd{background:#0b0e13;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>Human Distress Gold v1</h1>
  <label class="muted">reviewer_id <input id="reviewer" value="reviewer"></label>
  <button id="reload">Reload</button>
  <select id="filter">
    <option value="todo">Unreviewed</option>
    <option value="all">All</option>
    <option value="done">Reviewed</option>
    <option value="help_me">Help Me</option>
    <option value="madad_karo">मदद करो</option>
    <option value="mujhe_bachao">मुझे बचाओ</option>
    <option value="call_police">Call Police</option>
    <option value="i_need_help">I Need Help</option>
    <option value="send_help">Send Help</option>
    <option value="screaming">Screaming</option>
  </select>
  <span class="pill">folder labels are not gold</span>
</header>
<div class="targets" id="targets"></div>
<main>
  <aside id="list"></aside>
  <section id="detail">
    <div class="banner">Listen first. Confirm this is the intended phrase in a distress context. Do not accept a folder name as the label.</div>
  </section>
</main>
<script>
let items=[], verdicts={}, selected=null, categories=[];
const $ = id => document.getElementById(id);
async function load(){
  const rid = $("reviewer").value.trim() || "reviewer";
  const r = await fetch("/api/items?reviewer_id="+encodeURIComponent(rid));
  const data = await r.json();
  items = data.items || [];
  verdicts = data.my_verdicts || {};
  categories = data.categories || [];
  const c = (data.progress||{}).counts || {};
  $("targets").innerHTML =
    `<span>Candidates <b>${items.length}</b></span>`+
    `<span>DISTRESS <b>${c.DISTRESS||0}</b></span>`+
    `<span>NORMAL <b>${c.NORMAL||0}</b></span>`+
    `<span>UNCERTAIN <b>${c.UNCERTAIN||0}</b></span>`+
    `<span>Unreviewed <b>${c.UNREVIEWED||0}</b></span>`;
  renderList();
  if(selected) show(selected); else if(visible()[0]) show(visible()[0].sample_id);
}
function visible(){
  const f = $("filter").value;
  return items.filter(it => {
    const v = (verdicts[it.sample_id]||{}).manual_verdict || "";
    if(f==="todo") return !v;
    if(f==="done") return !!v;
    if(["help_me","madad_karo","mujhe_bachao","call_police","i_need_help","send_help","screaming"].includes(f))
      return it.phrase_category===f;
    return true;
  });
}
function renderList(){
  $("list").innerHTML = visible().map(it => {
    const v = (verdicts[it.sample_id]||{}).manual_verdict || "";
    return `<div class="row ${it.sample_id===selected?'sel':''}" data-id="${it.sample_id}">
      <i class="dot ${v}"></i>
      <div class="t">${it.sample_id} · ${it.proposed_phrase_display || it.phrase_category}</div>
    </div>`;
  }).join("") || "<div class='row'><div class='t'>No candidates in this filter. Drop new recordings into data/incoming/human_distress_gold_v1/ then re-run prepare.</div></div>";
  [...$("list").querySelectorAll(".row[data-id]")].forEach(el => el.onclick = () => show(el.dataset.id));
}
function show(id){
  selected = id;
  const it = items.find(x => x.sample_id===id);
  if(!it) return;
  renderList();
  const mine = verdicts[id] || {};
  const opts = categories.map(c => `<option value="${c}" ${((mine.confirmed_category||it.phrase_category)===c)?'selected':''}>${c}</option>`).join("");
  $("detail").innerHTML = `
    <div class="banner">Proposed phrase <b>${it.proposed_phrase_display || it.phrase_category}</b> is not gold until you verify the audio.</div>
    <div class="card">
      <h2 style="margin:0 0 8px">${it.sample_id}</h2>
      <audio controls src="/audio/${encodeURIComponent(it.sample_id)}"></audio>
      <div class="grid" style="margin-top:12px">
        <div class="k">Proposed phrase</div><div>${it.proposed_phrase_display} (${it.phrase_category})</div>
        <div class="k">Language</div><div>${it.language||""}</div>
        <div class="k">Environment</div><div>${it.environment||""}</div>
        <div class="k">Recording condition</div><div>${it.recording_condition||""}</div>
        <div class="k">Speaker</div><div>${it.speaker_id||""} ${it.gender||""}</div>
        <div class="k">Source</div><div>${it.source||""}</div>
        <div class="k">Leakage</div><div>${it.leakage_status}</div>
        <div class="k">HUMAN_VERIFIED</div><div>${mine.manual_verdict==="DISTRESS"||mine.manual_verdict==="NORMAL"?"true":"false"}</div>
      </div>
    </div>
    <div class="card">
      <label class="muted">Confirmed category (required when marking DISTRESS)
        <select id="cat">${opts}</select>
      </label>
      <div class="verdicts" style="margin-top:10px">
        <button class="v ${mine.manual_verdict==="DISTRESS"?"on":""}" data-v="DISTRESS">DISTRESS<small>Intended phrase, genuine distress context</small></button>
        <button class="v ${mine.manual_verdict==="NORMAL"?"on":""}" data-v="NORMAL">NORMAL<small>Not distress, or conversational/non-emergency use</small></button>
        <button class="v ${mine.manual_verdict==="UNCERTAIN"?"on":""}" data-v="UNCERTAIN">UNCERTAIN<small>Skip official scoring</small></button>
      </div>
      <p class="muted"><kbd>1</kbd> DISTRESS · <kbd>2</kbd> NORMAL · <kbd>3</kbd> UNCERTAIN · <kbd>N</kbd> next</p>
      <textarea id="notes" placeholder="optional notes">${mine.notes||""}</textarea>
    </div>`;
  [...$("detail").querySelectorAll(".v")].forEach(btn => btn.onclick = () => save(btn.dataset.v));
}
async function save(verdict){
  if(!selected) return;
  const rid = $("reviewer").value.trim() || "reviewer";
  const notes = ($("notes")||{}).value || "";
  const cat = ($("cat")||{}).value || "";
  const r = await fetch("/api/verdict", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({sample_id:selected, reviewer_id:rid, manual_verdict:verdict, confirmed_category:cat, notes})});
  const data = await r.json();
  if(!data.ok){ alert(data.error||"save failed"); return; }
  verdicts[selected] = {manual_verdict:verdict, confirmed_category:cat, notes};
  const vis = visible();
  const idx = vis.findIndex(x => x.sample_id===selected);
  await load();
  if(vis[idx+1]) show(vis[idx+1].sample_id);
}
$("reload").onclick = load;
$("filter").onchange = renderList;
document.addEventListener("keydown", e => {
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT") return;
  if(e.key==="1") save("DISTRESS");
  if(e.key==="2") save("NORMAL");
  if(e.key==="3") save("UNCERTAIN");
  if(e.key==="n"||e.key==="N"){
    const vis = visible();
    const idx = vis.findIndex(x => x.sample_id===selected);
    if(vis[idx+1]) show(vis[idx+1].sample_id);
  }
});
load();
</script>
</body>
</html>
